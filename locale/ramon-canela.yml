        body: "您好，\n\n這是來自 %{site_name} 的自動通知，告知您帳號已遭停權，停權期限至 %{suspended_till}。\n\n%{reason}\n\n停權期間您仍可瀏覽論壇，但在停權結束前無法參與討論。如有任何疑問，請聯絡[管理團隊](%{base_url}/about)。"
