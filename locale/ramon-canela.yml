        heading_anchors_label: 標題錨點連結
        inline_title_editor_help: '具備更改標題權限的使用者會在討論標題旁看到鉛筆圖示。點擊後標題會轉換為可編輯欄位，並提供標籤按鈕及 ✓／✕，用來儲存或取消變更。'
