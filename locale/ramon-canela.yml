        body: "感謝你接受邀請加入 %{site_name}，歡迎你的到來！\n\n- 我們已為你建立新帳號 **%{username}**。你可以前往[個人設定](%{user_preferences_url})修改名稱或密碼。\n\n我們始終重視並致力於維護[友善且理性的社群交流](%{guidelines_url})。\n\n祝你在這裡度過愉快的時光！"
        help: 取代一般的歡迎訊息，專門發送給透過邀請連結加入的會員。
        subject: '歡迎加入 %{site_name}！'
        title: 受邀加入歡迎訊息
