        marketplace_sidebar_label: 側邊欄中的「商店」區塊
        messages_help: '在 flarum/messages 原有功能上增加個人檔案訊息區塊（最新、已傳送、新訊息、未讀、封存）、個別會員的封存功能、訊息標題、表情反應及「留言」功能。'
        messages_label: 強化私人訊息
