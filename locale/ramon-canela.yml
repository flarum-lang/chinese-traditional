        links_sidebar_help: '將 FoF Links 的連結從頁首移至側邊欄區塊。'
        links_sidebar_label: 側邊欄連結
        marketplace_help: '讓商店頁面（商店首頁、商品、購物車、結帳、訂單、下載、賣家控制台、課程及方案）採用主題卡片版面，並使用類似頁首主視覺區塊的標題、主題按鈕、欄位、分頁及對話視窗。介面顏色會依主要顏色調整，圖示則使用 Lucide。'
