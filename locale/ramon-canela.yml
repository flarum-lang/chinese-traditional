      integrations:
        audit_help: '讓 flarum/audit 稽核紀錄採用主題外觀：在頭像上顯示代表變更內容的圖示，並依操作類型（建立、隱藏、編輯）以不同顏色的標籤呈現操作項目。紀錄會依日期分組，按下 Enter 即可套用篩選條件。'
