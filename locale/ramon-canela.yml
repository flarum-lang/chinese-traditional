        invite_permission: 邀請會員（邀請連結）
        invites_enabled_help: 具備「邀請」權限（位於「權限」設定）的使用者，可以在「分享」及「更多」選單中建立邀請連結，並設定有效期限及使用次數。透過邀請連結加入的會員會標記為受邀加入，邀請者則會收到「有人接受了你的邀請」通知。此功能需要開放會員註冊。
