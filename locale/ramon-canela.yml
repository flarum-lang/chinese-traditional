      topic_footer_help: '在最後一篇貼文後方顯示回覆、分享及追蹤按鈕。追蹤功能需要 Subscriptions 擴充套件。'
      topic_footer_label: 在討論串底部顯示操作按鈕
      topic_footer_notifications_help: 在討論串底部的按鈕區顯示「追蹤中」按鈕及通知層級說明。桌面版的時間軸鈴鐺已提供相同功能；手機及平板則會固定顯示底部按鈕，因為這是唯一可用的追蹤入口。
      topic_footer_notifications_label: 在底部顯示追蹤設定（桌面版）
      topic_map_help: 在第一篇貼文下方顯示摘要，包含建立日期、最後回覆時間、回覆數量及參與者。
      topic_map_label: 顯示討論摘要
      topic_reply_to_style_avocado: '在名稱下方顯示（Avocado 樣式）'
      topic_reply_to_style_discourse: '預設：在標題右側顯示 ↩ 名稱'
      topic_reply_to_style_help: '設定回覆其他貼文時，如何顯示回覆對象。預設樣式會在貼文標題右側顯示「↩ 名稱」，但只有在回覆對象不是上一則貼文時才會顯示。Avocado 樣式則會在名稱下方顯示「↳ 回覆給 [頭像] 名稱」，每篇回覆皆會顯示。點擊後可跳轉至被回覆的貼文。'
      topic_reply_to_style_label: 貼文中的「回覆對象」顯示方式
      topic_sticky_avatar_help: '閱讀較長的貼文時，作者頭像會隨著捲動保持在可視範圍內，直到該篇貼文結束，呈現類似 Avocado 主題的效果。僅適用於桌面版。'
      topic_sticky_avatar_label: 貼文頭像固定顯示
      topic_timeline_help: 在右側顯示導覽列，標示目前閱讀位置，並可快速跳轉至討論串中的任一篇貼文。
      topic_timeline_label: 在貼文旁顯示時間軸
      user_activity_reactions_help: 在「動態」下方以單一列表顯示會員給予的按讚及其他反應，取代原本的「按讚」分頁，並附上表情符號及貼文摘要。只有具備查看反應者權限的人才能看到反應內容。
      user_activity_reactions_label: 反應分頁
      user_activity_read_help: 在「動態」下方顯示會員已閱讀的討論，依最近閱讀時間排序。僅該會員本人及管理員可以查看。
      user_activity_read_label: 已讀分頁
      user_activity_solved_help: 在「動態」下方顯示會員獲選為最佳解答的回覆。
      user_activity_solved_label: 最佳解答分頁
      user_activity_votes_help: 在「動態」下方顯示會員曾參與投票的貼文。其他人只能看到允許公開投票者名單的投票。
      user_activity_votes_label: 投票分頁
      user_card_help: 以精簡資訊卡顯示會員照片、統計數據及個人檔案連結。點擊會員頭像或名稱即可開啟，無須離開目前頁面。
      user_card_label: 會員資訊卡
      user_cover_help: 在大型頭像及名稱後方顯示橫幅背景。
      user_cover_label: 在個人檔案頂部顯示封面
      user_default_tab_activity: '動態（貼文），與 Flarum 相同'
      user_default_tab_help: 當有人點擊頭像或名稱時，個人檔案預設開啟的分頁。
      user_default_tab_label: 開啟個人檔案時
      user_default_tab_summary: 摘要
      user_menu_help: '點擊頁首頭像會開啟整合式面板，並提供通知、回覆、按讚、訊息、書籤、聊天、審核及個人檔案等分頁，取代 Flarum 預設的通知鈴鐺與帳號選單。'
      user_menu_label: 主題會員選單
      user_stats_help: '在名稱下方顯示加入日期、最後上線時間、貼文數及討論數。按讚數僅在安裝 Likes 擴充套件時顯示。'
      user_stats_label: 會員統計資訊
