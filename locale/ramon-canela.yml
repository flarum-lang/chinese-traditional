        toc_title: 目錄
      embedded_replies_help: '點擊每篇貼文的「N 則回覆」即可在下方展開相關回覆，並在回覆內容上方顯示被引用的原始貼文。'
      embedded_replies_label: 內嵌回覆
      events:
        backend_off: 活動功能所需的後端程式（extend/events.php）尚未載入伺服器。
        events_chat_help: '建立活動時，可選擇啟用「活動聊天室」，自動建立專屬的 ramon/chat 頻道，並綁定活動所屬的討論標籤。標記為「會參加」的使用者會自動加入該頻道。'
        events_chat_label: 活動聊天室
        events_docked_chat_help: 桌面版會在討論右側顯示全高度的聊天室欄位；手機及平板版則會在活動資訊卡中提供聊天室連結。
        events_docked_chat_label: 在討論旁顯示聊天室
        events_enabled_help: '在編輯器的 ⊕ 選單中選擇「建立活動」，即可在第一篇貼文中加入活動資訊，包含日期、時間、時區、週期性活動、直播網址、地點及參加人數上限。貼文中會顯示活動資訊卡，提供「會參加」、「有興趣」及「不參加」選項、參加者名單，以及「加入行事曆」（Google 行事曆及 .ics）功能。停用後，活動資訊卡會改以一般文字呈現，API 也會如同此功能不存在般回應。'
        events_list_badge_help: '在討論列表的標題旁及討論串標題列中，顯示活動日期（例如「3 天後」、「2 天前」）。'
        events_list_badge_label: 在列表及標題列顯示日期
        events_reminder_minutes_help: '設定每次活動開始前幾分鐘，向標記為「會參加」的使用者發送提醒。設定為 0 則停用提醒。'
        events_reminder_minutes_label: 活動開始前提醒
        events_tag_any: 所有標籤
        events_tag_help: 只有在此標籤下建立新討論時，才會顯示「建立活動」按鈕；只有此標籤下的討論才會顯示活動資訊卡、列入「近期活動」及發送提醒。凡是具備該標籤討論建立權限的使用者，都可以建立活動（依照標籤本身的權限設定）。選擇「所有標籤」則適用於所有討論。
        events_tag_label: 活動標籤
        events_upcoming_help: '在側邊欄加入「活動」連結，提供 /events 頁面（列表及行事曆），並在活動標籤的討論列表頂部顯示近期活動日期。'
        events_upcoming_label: 近期活動
        minutes: 分鐘
        reminders_notice: '活動提醒由 Flarum 排程器每五分鐘檢查並發送一次，因此伺服器必須透過 cron 每分鐘執行一次「php flarum schedule:run」。'
        title: 活動
      extras:
        banner_enabled_help: 在每個頁面的內容上方顯示公告橫幅，並提供關閉按鈕。使用者關閉後便不會再次看到，直到公告文字變更為止。
        banner_enabled_label: 顯示公告橫幅
