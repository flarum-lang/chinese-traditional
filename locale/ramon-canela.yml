        list_dismiss_label: 「標記為已讀」按鈕
        list_last_visit_help: 在最新討論列表中，以紅線區分上次造訪後有更新的討論，以及當時就已經是目前狀態的討論。上次造訪時間會儲存在讀者的裝置中。
        list_last_visit_label: 「上次造訪」分隔線
        list_title: 上次造訪與標記為已讀
