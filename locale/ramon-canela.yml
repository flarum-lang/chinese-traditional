        polls_label: 投票
        profile_cover_help: 使用此擴充套件提供的封面，取代主題內建封面。封面會顯示於個人檔案橫幅、會員資訊卡後方（有縮圖時使用縮圖），以及擴充套件編輯器所選擇的位置。編輯器可從個人檔案的「⋯」選單及「設定」開啟。主題原有的封面圖片仍會保留；停用此選項後便會恢復使用。
        profile_cover_label: 個人檔案封面（forumaker/profile-cover）
        ramon_chat_help: '讓 ramon/chat 擴充套件採用主題的聊天介面，包括不含第二欄的頁面、側邊面板、訊息、編輯器、討論串及頻道畫面。啟用此擴充套件後，主題內建的聊天功能會自動讓位。'
