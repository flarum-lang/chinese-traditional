      user_summary_label: 摘要分頁
      welcome_banner_guests_only_help: 已登入的會員會直接進入討論列表，歡迎橫幅僅供首次造訪的訪客瀏覽。
      welcome_banner_guests_only_label: 僅對訪客顯示
      welcome_banner_help: 在染色背景上方顯示「外觀」中設定的歡迎標題及訊息。停用後，首頁將直接顯示討論列表。
      welcome_banner_label: 顯示歡迎橫幅
