        body: "您好，\n\n這是來自 %{site_name} 的自動通知，告知您[先前發布的貼文](%{base_url}%{url}) 已遭移除。\n\n%{flag_reason}\n\n此貼文經社群成員檢舉後，已由管理團隊成員決定移除。\n\n```\n%{flagged_post_raw_content}\n```\n\n詳情請參閱我們的[社群守則](%{guidelines_url})。"
        help: '管理團隊隱藏或刪除遭檢舉的貼文時發送。需要啟用 Flags 擴充套件（flarum/flags）。'
        reason_other: 其他
        subject: 管理團隊已移除遭檢舉的貼文
        title: 遭檢舉的貼文已移除
