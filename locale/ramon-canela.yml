        subject: '歡迎加入 %{site_name}！'
        title: 歡迎加入
    system_user:
      bio: 這不是真實使用者，而是專門用於發送系統通知及執行其他系統工作的共用帳號。
      create: 建立系統帳號
      created_as: '系統帳號：{name}'
      help: 系統專用帳號：用來發送自動通知（書籤提醒及徽章通知），以及下方設定的自動化訊息。這是一個論壇中的一般會員帳號，具有個人檔案、頭像及個人簡介，但不會登入系統：沒有登入功能、密碼、密碼重設或使用者工作階段。其他人無法傳送訊息給此帳號，而且此帳號不會出現在會員目錄中。
