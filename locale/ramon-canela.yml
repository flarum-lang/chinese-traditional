        push_help: '即使論壇已關閉，手機及電腦仍可收到通知。每位會員都必須在「設定」→「通知」中自行啟用，通知類型表格也會新增「推播」欄位供選擇。此功能需要 HTTPS，並且必須啟動佇列工作程序，避免通知延遲送達。'
