      content_width_help: '設定內容卡片（討論列表、討論串及個人檔案）的最大寬度；在討論串中，貼文欄位也會隨之擴展。預設寬度為 1110px；90% 與全寬模式則會依螢幕尺寸調整。預覽會以 1440px 螢幕寬度呈現實際論壇畫面。'
