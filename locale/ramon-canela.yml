        banner_reshow_done: 公告橫幅將重新向所有人顯示。
        banner_text_help: '支援 Markdown、BBCode 及表情符號，使用方式與一般貼文相同。若要使用 HTML，請以 HTML 標籤（例如 p、div 等）作為內容開頭。留空時不會顯示公告橫幅。'
        banner_text_label: 公告內容
        banner_title: 公告橫幅
        bulk_select_enabled_help: 列表工具列會新增按鈕，啟用後可勾選各個討論，並顯示操作列，提供標記為已讀、置頂、關閉、更改標籤、隱藏及刪除等操作。只有具備列表中至少一則討論管理權限的使用者才會看到此功能，而且每項操作只會套用於其具備相應權限的討論。
        bulk_select_enabled_label: 版主批次選取功能
        bulk_title: 批次選取
        history_notice: 只有啟用此功能期間進行的編輯才會留下紀錄。停用後不會再儲存新紀錄，論壇中也不會顯示編輯紀錄；但已儲存的資料仍會保留在資料庫中。隱藏貼文的歷史版本內容，只有具備該貼文編輯權限的使用者才能查看。
        history_title: 編輯紀錄
        post_history_enabled_help: 每次編輯都會保留先前的文字內容。貼文上的「已編輯」標記會改為鉛筆圖示及修訂次數，點擊後即可比較不同版本，並可選擇行內或左右並排方式檢視。
        post_history_enabled_label: 儲存並顯示編輯紀錄
        post_history_public_help: '停用後，只有貼文作者及具備編輯權限的使用者能開啟編輯紀錄；其他人則會看到 Flarum 原有的「已編輯」標記。'
        post_history_public_label: 所有人都能查看編輯紀錄
        print_title: 列印討論
        print_topic_enabled_help: '將所有貼文載入精簡的列印版面（不含側邊欄、頁首及時間軸），並開啟瀏覽器的列印視窗，也可以選擇另存為 PDF。'
        print_topic_enabled_label: 在討論操作選單中加入「列印」
        search_notice: '這些篩選條件也可以直接作為搜尋語法使用，例如 in:title、in:likes、in:bookmarks 及 min-posts:5，並可搭配 Flarum 原有的搜尋語法（author:、tag:、is:locked 等）。'
        search_page_enabled_help: '新增 /search 搜尋頁面，提供討論、貼文、標籤及會員分頁，並支援進階篩選條件（作者、主要標籤、標籤、僅搜尋標題、已按讚、狀態、日期、最低貼文數）及排序功能。搜尋彈出視窗也會新增「進階搜尋」連結。'
        search_page_enabled_label: 進階搜尋頁面
        search_title: 搜尋頁面
        text_size_enabled_help: 每位使用者都可以在「設定」中選擇「較小／標準／較大／最大」字體。選擇會套用於目前裝置，並儲存在瀏覽器中。
        text_size_enabled_label: 文字大小選擇功能
        text_size_title: 文字大小
        top_periods_enabled_help: 熱門分頁會提供「不限時間／年度／季度／月份／週／今天」選項，只顯示所選期間內建立的討論。
        top_periods_enabled_label: 熱門分頁的期間選擇器
        top_periods_title: 依期間查看熱門討論
      font_help: '套用於整個論壇的字型。主題內建 Inter 和 Plus Jakarta Sans，適用於拉丁字母；系統字型則不需下載任何字型檔，並支援所有文字系統。'
      font_inter: Inter：主題預設字型
      font_jakarta: 'Plus Jakarta Sans'
      font_label: 論壇字型
