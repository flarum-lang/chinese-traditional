      composer:
        drafts_help: '搭配 FoF Drafts 擴充套件時，主題會以以下方式管理草稿：建立新討論或回覆時，停止輸入兩秒後會自動儲存；回到討論串回覆時會自動載入先前的草稿；關閉含有文字的編輯器時，會詢問要捨棄或保留草稿；「開始新討論」按鈕則會加入 ⌄ 選單，列出所有草稿。草稿也會顯示於會員選單及個人檔案的「草稿」分頁。'
