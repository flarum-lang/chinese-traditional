      cooked:
        backend_off: 註腳及目錄語法所需的後端程式（extend/cooked.php）尚未載入伺服器。
        footnotes_help: '支援註腳語法：在內文中使用「text[^1]」，並在貼文結尾加入「[^1]: 註腳內容」；也可以使用行內註腳「^[註腳內容]」。註腳編號會以較小字體顯示於文字上方，點擊後會透過提示框顯示註腳內容。編輯器的 ⊕ 選單也會新增「註腳」功能。停用後，註腳語法會維持原樣顯示，例如「[1]」及「[1]: 文字」。'
        footnotes_title: 註腳
        toc_auto_tags_help: '在這些標籤下的討論中，即使第一篇貼文沒有加入 [toc]，只要標題數量達到門檻，系統仍會自動產生目錄。'
        toc_auto_tags_label: 自動產生目錄的標籤
        toc_help: '在第一篇貼文中加入 [toc]（也可以透過編輯器的 ⊕ 選單選擇「插入目錄」），標題就會顯示在時間軸欄位中，並標示目前所在的標題，另外提供「跳至底部」功能。下方按鈕可切換「目錄」與「時間軸」，選擇結果會儲存在瀏覽器中。手機版的目錄則會顯示於時間軸面板內。'
        toc_min_headings_help: 第一篇貼文中的標題數未達此門檻時，不會顯示目錄。
