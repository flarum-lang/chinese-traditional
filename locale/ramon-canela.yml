        help: '會員升級至信任等級 1（基礎）時發送。需要啟用信任等級功能。'
        subject: 感謝你花時間參與我們的社群
        title: '信任等級 1'
      welcome_user:
        body: "感謝你加入 %{site_name}，歡迎你的到來！\n\n我們始終重視並致力於維護[友善且理性的社群交流](%{guidelines_url})。\n\n祝你在這裡度過愉快的時光！"
