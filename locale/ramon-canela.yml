        not_found_page_help: 以「找不到此頁面。」、「返回首頁」及搜尋功能取代一般錯誤頁面。下方選擇的版型會決定頁面的設計，以及要顯示哪些討論。
        not_found_page_label: '404 錯誤頁面'
