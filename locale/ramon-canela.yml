        realtime_off: '未啟用 flarum/realtime 時，聊天功能會每隔幾秒向伺服器查詢新訊息。功能仍可正常使用，但會有些許延遲，且伺服器請求次數較多。若要即時接收訊息，請啟用 flarum/realtime 並執行「php flarum realtime:serve」。'
