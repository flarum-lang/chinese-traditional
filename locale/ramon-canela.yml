        body: "你的信任等級又提升了一級！\n\n達到信任等級 2，代表你已經投入足夠的時間閱讀內容並積極參與討論，成為社群中的正式一員。\n\n歡迎繼續參與社群活動！有你的加入，讓我們的社群更加精彩。"
