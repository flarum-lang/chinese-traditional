        groups_profile_links_label: 個人檔案中的群組連結至群組頁面
        guidelines_enabled_help: '顯示論壇社群規範，並以分頁形式排列於「關於」旁，也會加入側邊欄的「更多」選單。/faq 會導向相同頁面。只有在有內容時（下方文字或 fof/pages 頁面）才會顯示此頁面。'
