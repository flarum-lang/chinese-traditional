        about_show_staff_label: 顯示管理團隊
        about_show_stats_help: '顯示過去 24 小時、7 天、30 天及累計的討論數、貼文數、註冊人數、活躍使用者及按讚數。'
        about_show_stats_label: 顯示網站統計資料
        about_text_help: '顯示於標題下方。支援 Markdown 和 BBCode（依論壇啟用的格式而定）；若內容包含 HTML 標籤，則會直接以 HTML 呈現，不進行格式轉換。'
        about_text_label: 關於我們的內容
        directory_enabled_help: 以表格列出每位會員收到及送出的按讚數、討論數、回覆數及最後上線時間，並可依統計期間篩選及按照欄位排序。
        directory_enabled_label: 會員列表頁面（/u）
