        emoji_help: '點擊工具列中的表情符號按鈕，即可開啟選擇器，提供搜尋、分類、最近使用及膚色選擇功能。啟用 Emoji 擴充套件後，表情符號會以該擴充套件提供的圖片顯示。'
        emoji_label: 表情符號選擇器
        emoji_notice: 'Emoji 擴充套件目前已停用：選擇器會使用系統內建的表情符號，主題則會提供「:名稱」自動完成建議。'
