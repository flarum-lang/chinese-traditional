        assign_bot_created_as: 'AI 助理：{name}'
        assign_bot_help: 請至助理的個人檔案修改名稱、頭像及個人簡介。助理的回覆時機與方式則在下方區塊設定。
        assign_bot_missing: '請建立 AI 助理帳號：使用獨立於系統帳號的專屬帳號，透過主題的 AI 功能在討論串中回覆。'
        assign_bot_open_profile: 開啟個人檔案
