        hashtags_help: '在編輯器中輸入 # 時，會自動建議標籤並插入連結；在貼文中，這些連結（以及 Mentions 擴充套件的標籤提及）會轉換為帶有標籤圖示的膠囊標籤。'
        hashtags_label: '標籤 Hashtag'
        hashtags_mentions_notice: '啟用 Mentions 擴充套件後，編輯器中的 # 功能會由該擴充套件接管（標籤提及）；主題只負責將貼文中的標籤提及呈現為 Hashtag。'
        linked_topic_help: '在回覆編輯器中，點擊「↩ ▾」選單，即可將回覆轉換為新討論，保留相同文字、加入返回原討論的連結，並沿用相同標籤。'
        linked_topic_label: 以連結討論的方式回覆
        preview_help: '桌面版會在編輯器右側即時顯示格式化後的貼文預覽。使用者可點擊編輯器角落的 « 按鈕隱藏預覽。'
        preview_label: 左右並排預覽
        requires_composer: 主題編輯器功能目前已停用（請參閱上方的「主題編輯器」區塊）。
        section_drafts: 草稿
        section_editor: 主題編輯器
        section_hashtags: '#標籤'
